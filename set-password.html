<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set password — Zero to Paid with AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F2;--ink:#1E1A16;--line:#E3DCC9;--purple:#7C3AED;}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border:1px solid var(--line);padding:36px;max-width:420px;width:100%;box-shadow:6px 6px 0 var(--line);}
h1{font-family:'Big Shoulders Display',sans-serif;font-size:32px;margin-bottom:8px;}p{color:#5B5449;font-size:14px;margin-bottom:18px;}
label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#948C7C;display:block;margin:14px 0 6px;}
input{width:100%;padding:12px 14px;border:1px solid var(--line);font-family:inherit;font-size:15px;}
input[type="password"]{padding-right:44px;}
.pw-wrap{position:relative;}
.eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#948C7C;font-size:16px;line-height:1;padding:6px;display:flex;align-items:center;}
.eye-btn:hover{color:var(--ink);}
button{width:100%;margin-top:18px;background:var(--ink);color:#fff;border:none;padding:12px;font-family:'IBM Plex Mono',monospace;font-weight:600;cursor:pointer;}
button:hover{background:var(--purple);}
.msg{margin-top:12px;font-size:13px;display:none;padding:10px;border:1px solid var(--line);}
</style>
</head>
<body>
<div class="card">
  <h1>Set your password</h1>
  <p>Choose a password for <span id="emailHint"></span> — you’ll use it next time to log in.</p>
  <label>New password (8+ chars)</label>
  <div class="pw-wrap">
    <input id="pw1" type="password" placeholder="••••••••">
    <button type="button" class="eye-btn" data-target="pw1" aria-label="Show password">👁️</button>
  </div>
  <label>Confirm</label>
  <div class="pw-wrap">
    <input id="pw2" type="password" placeholder="••••••••">
    <button type="button" class="eye-btn" data-target="pw2" aria-label="Show password">👁️</button>
  </div>
  <button id="saveBtn">Save & open Blueprint →</button>
  <div id="msg" class="msg"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const sess = params.get('session');
if(sess) document.cookie = `__session=${sess}; Path=/; SameSite=Lax; Max-Age=${60*60*24*30}`;
(async ()=>{
  const me = await fetch('/api/me').then(r=>r.json()).catch(()=>({}));
  if(me.email) document.getElementById('emailHint').textContent = me.email;
})();
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  const msg=document.getElementById('msg');
  if(p1.length<8){msg.textContent='8+ characters required';msg.style.display='block';return;}
  if(p1!==p2){msg.textContent='Passwords do not match';msg.style.display='block';return;}
  const res = await fetch('/api/auth/set-password', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:p1, session: sess})});
  const data=await res.json().catch(()=>({}));
  if(res.ok){ location.href='/checklist.html'; } else { msg.textContent=data.error||'Failed'; msg.style.display='block'; }
});
document.querySelectorAll('.eye-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const input = document.getElementById(btn.dataset.target);
    if(!input) return;
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁️';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
});
</script>
</body>
</html>
